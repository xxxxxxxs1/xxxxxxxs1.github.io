<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} · {{ site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header class="site-header">
  <div class="container">

    <div class="site-title">
      <a href="{{ '/' | relative_url }}">
        {{ site.title }}
      </a>
    </div>

    <div class="site-description">
      {{ site.description }}
    </div>

    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/archives/' | relative_url }}">文章列表</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
      <a href="https://github.com/xxxxxxxs1">Github</a>
    </nav>

  </div>
</header>


<main class="container main-content">

  <article class="page">

    <h1 class="post-title">
      {{ page.title }}
    </h1>

    <div class="post-content">
      {{ content }}
    </div>

  </article>

</main>


<footer class="site-footer">
  <div class="container">
    © {{ site.time | date: "%Y" }} ydx
  </div>
</footer>

</body>
</html>
